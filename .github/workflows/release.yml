# Builds the Linux app on every push to the linux branch, and publishes a
# GitHub Release with a ready-to-run download when a tag like v1.25.0 is pushed.
name: Linux build and release

on:
  push:
    branches: [linux]
    tags: ["v*"]
  pull_request:
    branches: [linux]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    outputs:
      name: ${{ steps.package.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libxkbcommon-dev libwayland-dev \
            libx11-dev libxcursor-dev libxrandr-dev libxi-dev libgl1-mesa-dev

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Package
        id: package
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then version="dev-${GITHUB_SHA::7}"; fi
          name="steamless-controller-${version}-x86_64-linux"
          mkdir -p "dist/$name"
          cp target/release/steamless-controller README.md LICENSE MECHANICS.md \
             packaging/steamless-controller.desktop packaging/install.sh \
             packaging/udev/70-steamless-controller.rules "dist/$name/"
          chmod +x "dist/$name/install.sh" "dist/$name/steamless-controller"
          tar -C dist -czf "dist/$name.tar.gz" "$name"
          (cd dist && sha256sum "$name.tar.gz" > "$name.tar.gz.sha256")
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: dist/*.tar.gz*

      - name: Publish release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          name: Steamless Controller for Linux ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*.tar.gz
            dist/*.tar.gz.sha256

  # An Arch Linux / CachyOS package for each release, installable with
  # `sudo pacman -U <url>` without the AUR.
  pacman:
    needs: build
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.name }}
          path: dist

      - name: Build pacman package
        env:
          NAME: ${{ needs.build.outputs.name }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          useradd -m builder
          chown -R builder "$PWD"
          su builder -c "bash packaging/arch/make-pkg.sh 'dist/$NAME.tar.gz' '$version' dist/pkg"
          cd dist/pkg
          pkg=$(ls steamless-controller-bin-*-x86_64.pkg.tar.zst)
          # The same package under a name that never changes, so
          # .../releases/latest/download/steamless-controller-bin-x86_64.pkg.tar.zst
          # always gives the newest one.
          cp "$pkg" steamless-controller-bin-x86_64.pkg.tar.zst
          for f in *.pkg.tar.zst; do sha256sum "$f" > "$f.sha256"; done

      - name: Sign packages and build the pacman repository
        env:
          PACMAN_SIGNING_KEY: ${{ secrets.PACMAN_SIGNING_KEY }}
        run: |
          # The secret key only ever lives in this container's gpg.
          printf '%s\n' "$PACMAN_SIGNING_KEY" | gpg --batch --quiet --import
          bash packaging/arch/sign-repo.sh dist/pkg
          cp packaging/arch/steamless-controller.asc dist/pkg/

      - name: Attach to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pkg/*.pkg.tar.zst
            dist/pkg/*.pkg.tar.zst.sha256
            dist/pkg/*.sig
            dist/pkg/steamless-controller.db
            dist/pkg/steamless-controller.db.tar.gz
            dist/pkg/steamless-controller.files
            dist/pkg/steamless-controller.files.tar.gz
            dist/pkg/steamless-controller.asc
