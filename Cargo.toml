[package]
name = "steamless-controller"
version = "1.25.1"
edition = "2021"
description = "Use a Steam Controller as a standard gamepad on Linux without Steam"
license = "MIT"
repository = "https://github.com/Punjudge/SteamlessController-Linux"
homepage = "https://github.com/Punjudge/SteamlessController-Linux"
readme = "README.md"

[[bin]]
name = "steamless-controller"
path = "src/main.rs"

[dependencies]
eframe = "0.36"
egui = "0.36"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ksni = { version = "0.3", default-features = false, features = ["blocking", "async-io"] }
image = { version = "0.25", default-features = false, features = ["png"] }
dirs = "6"

[profile.release]
opt-level = 3
